spring:
  application:
    name: api
  config:
    import: optional:file:.env[.properties] # 로컬 비밀값 (git 제외)
  datasource:
    url: jdbc:postgresql://localhost:5432/marketing_hub
    username: hub
    password: hub # 로컬 개발 전용 (docker-compose.yml)
  jpa:
    hibernate:
      ddl-auto: validate # 스키마는 Flyway가 관리
    open-in-view: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, email, https://www.googleapis.com/auth/webmasters.readonly

app:
  credential-key: ${CREDENTIAL_KEY} # base64 32바이트, credential.secret_enc 암호화 키

server:
  error:
    include-message: always # 400/409 거절 사유를 화면에 보여줌 (메시지는 사용자용 문구만 씀)
